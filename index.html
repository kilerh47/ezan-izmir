  <script>
    const FALLBACK_DATA_JUNE_2026 = {"1": {"Imsak": "03:56", "Gunes": "05:42", "Ogle": "13:14", "Ikindi": "17:08", "Aksam": "20:36", "Yatsi": "22:15"}, "2": {"Imsak": "03:55", "Gunes": "05:42", "Ogle": "13:14", "Ikindi": "17:08", "Aksam": "20:37", "Yatsi": "22:16"}, "3": {"Imsak": "03:55", "Gunes": "05:42", "Ogle": "13:15", "Ikindi": "17:08", "Aksam": "20:38", "Yatsi": "22:17"}, "4": {"Imsak": "03:54", "Gunes": "05:41", "Ogle": "13:15", "Ikindi": "17:08", "Aksam": "20:38", "Yatsi": "22:18"}, "5": {"Imsak": "03:53", "Gunes": "05:41", "Ogle": "13:15", "Ikindi": "17:09", "Aksam": "20:39", "Yatsi": "22:19"}, "6": {"Imsak": "03:53", "Gunes": "05:41", "Ogle": "13:15", "Ikindi": "17:09", "Aksam": "20:40", "Yatsi": "22:20"}, "7": {"Imsak": "03:52", "Gunes": "05:41", "Ogle": "13:15", "Ikindi": "17:09", "Aksam": "20:40", "Yatsi": "22:21"}, "8": {"Imsak": "03:52", "Gunes": "05:40", "Ogle": "13:16", "Ikindi": "17:09", "Aksam": "20:41", "Yatsi": "22:21"}, "9": {"Imsak": "03:51", "Gunes": "05:40", "Ogle": "13:16", "Ikindi": "17:10", "Aksam": "20:41", "Yatsi": "22:22"}, "10": {"Imsak": "03:51", "Gunes": "05:40", "Ogle": "13:16", "Ikindi": "17:10", "Aksam": "20:42", "Yatsi": "22:23"}, "11": {"Imsak": "03:51", "Gunes": "05:40", "Ogle": "13:16", "Ikindi": "17:10", "Aksam": "20:42", "Yatsi": "22:24"}, "12": {"Imsak": "03:51", "Gunes": "05:40", "Ogle": "13:16", "Ikindi": "17:10", "Aksam": "20:43", "Yatsi": "22:24"}, "13": {"Imsak": "03:50", "Gunes": "05:40", "Ogle": "13:17", "Ikindi": "17:11", "Aksam": "20:43", "Yatsi": "22:25"}, "14": {"Imsak": "03:50", "Gunes": "05:40", "Ogle": "13:17", "Ikindi": "17:11", "Aksam": "20:44", "Yatsi": "22:25"}, "15": {"Imsak": "03:50", "Gunes": "05:40", "Ogle": "13:17", "Ikindi": "17:11", "Aksam": "20:44", "Yatsi": "22:26"}, "16": {"Imsak": "03:50", "Gunes": "05:40", "Ogle": "13:17", "Ikindi": "17:11", "Aksam": "20:44", "Yatsi": "22:26"}, "17": {"Imsak": "03:50", "Gunes": "05:40", "Ogle": "13:17", "Ikindi": "17:12", "Aksam": "20:45", "Yatsi": "22:27"}, "18": {"Imsak": "03:50", "Gunes": "05:40", "Ogle": "13:18", "Ikindi": "17:12", "Aksam": "20:45", "Yatsi": "22:27"}, "19": {"Imsak": "03:50", "Gunes": "05:40", "Ogle": "13:18", "Ikindi": "17:12", "Aksam": "20:45", "Yatsi": "22:27"}, "20": {"Imsak": "03:50", "Gunes": "05:41", "Ogle": "13:18", "Ikindi": "17:12", "Aksam": "20:45", "Yatsi": "22:28"}, "21": {"Imsak": "03:50", "Gunes": "05:41", "Ogle": "13:18", "Ikindi": "17:13", "Aksam": "20:46", "Yatsi": "22:28"}, "22": {"Imsak": "03:51", "Gunes": "05:41", "Ogle": "13:18", "Ikindi": "17:13", "Aksam": "20:46", "Yatsi": "22:28"}, "23": {"Imsak": "03:51", "Gunes": "05:41", "Ogle": "13:19", "Ikindi": "17:13", "Aksam": "20:46", "Yatsi": "22:28"}, "24": {"Imsak": "03:51", "Gunes": "05:42", "Ogle": "13:19", "Ikindi": "17:13", "Aksam": "20:46", "Yatsi": "22:28"}, "25": {"Imsak": "03:52", "Gunes": "05:42", "Ogle": "13:19", "Ikindi": "17:13", "Aksam": "20:46", "Yatsi": "22:28"}, "26": {"Imsak": "03:52", "Gunes": "05:42", "Ogle": "13:19", "Ikindi": "17:14", "Aksam": "20:46", "Yatsi": "22:28"}, "27": {"Imsak": "03:53", "Gunes": "05:43", "Ogle": "13:20", "Ikindi": "17:14", "Aksam": "20:46", "Yatsi": "22:28"}, "28": {"Imsak": "03:53", "Gunes": "05:43", "Ogle": "13:20", "Ikindi": "17:14", "Aksam": "20:46", "Yatsi": "22:28"}, "29": {"Imsak": "03:54", "Gunes": "05:43", "Ogle": "13:20", "Ikindi": "17:14", "Aksam": "20:46", "Yatsi": "22:28"}, "30": {"Imsak": "03:54", "Gunes": "05:44", "Ogle": "13:20", "Ikindi": "17:14", "Aksam": "20:46", "Yatsi": "22:28"}};

    const THEMES = {
      Imsak: { color1: '#f0fdf4', color2: '#dcfce7', color3: '#bbf7d0', accent: '#16a34a' },
      Gunes: { color1: '#fffbeb', color2: '#fef3c7', color3: '#fde68a', accent: '#ea580c' },
      Ogle: { color1: '#f0f9ff', color2: '#e0f2fe', color3: '#bae6fd', accent: '#0284c7' },
      Ikindi: { color1: '#fff7ed', color2: '#ffedd5', color3: '#fed7aa', accent: '#d97706' },
      Aksam: { color1: '#fff1f2', color2: '#ffe4e6', color3: '#fecdd3', accent: '#e11d48' },
      Yatsi: { color1: '#f8fafc', color2: '#f1f5f9', color3: '#e2e8f0', accent: '#4f46e5' }
    };

    const MONTH_NAMES = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
    const PRAYER_NAMES = ["Imsak", "Gunes", "Ogle", "Ikindi", "Aksam", "Yatsi"];
    const PRAYER_DISPLAY_NAMES = { Imsak: "İmsak", Gunes: "Güneş", Ogle: "Öğle", Ikindi: "İkindi", Aksam: "Akşam", Yatsi: "Yatsı" };

    let currentPrayerTimes = null;
    let hijriDateStr = "-- ------ ----";

    function calculateHijriDate(date) {
      const iMonthNames = ["Muharrem", "Sefer", "Rebiülevvel", "Rebiülahır", "Cemaziyelevvel", "Cemaziyelahır", "Recep", "Şaban", "Ramazan", "Şevval", "Zilkade", "Zilhicce"];
      let year = date.getFullYear(); let month = date.getMonth() + 1; let day = date.getDate();
      if (month < 3) { year -= 1; month += 12; }
      let a = Math.floor(year / 100); let b = 2 - a + Math.floor(a / 4);
      let jd = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + b - 1524.5;
      let diff = jd - 1948439.5; let cycle = Math.floor(diff / 10631); diff = diff % 10631;
      let yearCycle = Math.floor(diff / 354.36667); let hYear = cycle * 30 + yearCycle + 1;
      let dayOfYear = Math.round(diff - yearCycle * 354.36667);
      let hMonth = 0; let hDay = dayOfYear; const monthLengths = [30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 29];
      for (let i = 0; i < 12; i++) {
        let len = monthLengths[i];
        if (i === 11) { len = (((11 * hYear + 14) % 30) < 11) ? 30 : 29; }
        if (hDay <= len) { hMonth = i + 1; break; }
        hDay -= len; if (i === 11) hMonth = 12;
      }
      let cDay = hDay - 1; let cMonth = hMonth; let cYear = hYear;
      if (cDay <= 0) {
        cMonth -= 1; if (cMonth <= 0) { cMonth = 12; cYear -= 1; }
        let len = monthLengths[cMonth - 1];
        if (cMonth === 12) { len = (((11 * cYear + 14) % 30) < 11) ? 30 : 29; }
        cDay = len + cDay;
      }
      return `${cDay} ${iMonthNames[cMonth - 1]} ${cYear}`;
    }

    function getStoredTimings() { try { const stored = localStorage.getItem('ezanIzmirTimingsV2'); return stored ? JSON.parse(stored) : null; } catch (e) { return null; } }
    function saveTimings(timings) { try { localStorage.setItem('ezanIzmirTimingsV2', JSON.stringify(timings)); } catch (e) {} }

    async function fetchMonthlyPrayerTimes(year, month) {
      const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 6000); 
      try {
        const response = await fetch(`https://api.aladhan.com/v1/calendarByCity/${year}/${month}?city=Izmir&country=Turkey&method=13`, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error("API error");
        const resJson = await response.json();
        if (resJson.code !== 200 || !resJson.data) throw new Error("API data empty");
        const monthlyMap = {};
        resJson.data.forEach(dayItem => {
          const gregDate = dayItem.date.gregorian.date; const rawT = dayItem.timings;
          monthlyMap[gregDate] = {
            Imsak: rawT.Fajr.split(" ")[0], Gunes: rawT.Sunrise.split(" ")[0], Ogle: rawT.Dhuhr.split(" ")[0],
            Ikindi: rawT.Asr.split(" ")[0], Aksam: rawT.Maghrib.split(" ")[0], Yatsi: rawT.Isha.split(" ")[0],
            hijri: `${dayItem.date.hijri.day} ${dayItem.date.hijri.month.tr || dayItem.date.hijri.month.en} ${dayItem.date.hijri.year}`
          };
        });
        return monthlyMap;
      } catch (err) { clearTimeout(timeoutId); return null; }
    }

    async function loadPrayerData() {
      const now = new Date();
      const year = now.getFullYear(); const month = now.getMonth() + 1; const day = now.getDate();
      const formattedToday = `${String(day).padStart(2, '0')}-${String(month).padStart(2, '0')}-${year}`;
      let localCache = getStoredTimings() || {};

      if (!localCache[formattedToday]) {
        const apiData = await fetchMonthlyPrayerTimes(year, month);
        if (apiData) { localCache = { ...localCache, ...apiData }; saveTimings(localCache); }
      }
      if (new Date(year, month, 0).getDate() === day) {
        const nextMonthDate = new Date(year, month, 1);
        const nextY = nextMonthDate.getFullYear(); const nextM = nextMonthDate.getMonth() + 1;
        const formattedNextFirst = `01-${String(nextM).padStart(2, '0')}-${nextY}`;
        if (!localCache[formattedNextFirst]) {
          const nextApiData = await fetchMonthlyPrayerTimes(nextY, nextM);
          if (nextApiData) { localCache = { ...localCache, ...nextApiData }; saveTimings(localCache); }
        }
      }

      if (localCache[formattedToday]) {
        currentPrayerTimes = localCache[formattedToday];
        hijriDateStr = currentPrayerTimes.hijri || calculateHijriDate(now);
      } else {
        if (year === 2026 && month === 6 && FALLBACK_DATA_JUNE_2026[day]) {
          currentPrayerTimes = FALLBACK_DATA_JUNE_2026[day]; hijriDateStr = calculateHijriDate(now);
        } else if (year === 2026 && month === 5 && day === 31) {
          currentPrayerTimes = { Imsak: "03:47", Gunes: "05:43", Ogle: "13:14", Ikindi: "17:08", Aksam: "20:35", Yatsi: "22:14" };
          hijriDateStr = "14 Zilhicce 1447";
        } else {
          currentPrayerTimes = { Imsak: "03:45", Gunes: "05:42", Ogle: "13:15", Ikindi: "17:10", Aksam: "20:40", Yatsi: "22:20" };
          hijriDateStr = calculateHijriDate(now);
        }
      }

      document.getElementById('hijri-date').textContent = hijriDateStr;
      renderPrayerList();
    }

    function renderPrayerList() {
      const container = document.getElementById('prayer-list-container');
      container.innerHTML = '';
      PRAYER_NAMES.forEach(p => {
        const row = document.createElement('div');
        row.id = `row-${p}`;
        row.innerHTML = `
          <div class="flex items-center gap-1 sm:gap-2">
            <span id="icon-${p}" class="text-lg font-black w-5 text-center opacity-50 text-slate-500"></span>
            <span id="name-${p}" class="text-xl leading-none font-black tracking-wide uppercase text-slate-800 ml-1">${PRAYER_DISPLAY_NAMES[p]}</span>
            <span id="tomorrow-badge-${p}" class="hidden ml-2 bg-slate-200 text-slate-600 border border-slate-300 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider shadow-sm">Yarın</span>
          </div>
          <div class="flex flex-col items-end">
            <span id="time-${p}" class="text-2xl leading-none font-black tabular-nums text-slate-900 outfit-font">${currentPrayerTimes[p]}</span>
            <span id="status-${p}" class="text-[9px] font-bold tracking-widest text-slate-400 uppercase hidden mt-0.5">Geçti</span>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function updateEngine() {
      const now = new Date();
      const hoursStr = String(now.getHours()).padStart(2, '0');
      const minsStr = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('digital-clock').textContent = `${hoursStr}:${minsStr}`;
      const day = now.getDate();
      document.getElementById('gregorian-date').textContent = `${day} ${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}`;

      if (!currentPrayerTimes) return;

      const todayDateStr = now.toDateString();
      const prayerDates = {};
      PRAYER_NAMES.forEach(p => { prayerDates[p] = new Date(`${todayDateStr} ${currentPrayerTimes[p]}:00`); });

      let nextPrayer = "Imsak";
      let nextPrayerDate = null;
      let activePeriod = "Yatsi";
      let isNextPrayerTomorrow = false;
      const currentTimeMs = now.getTime();

      if (currentTimeMs < prayerDates["Imsak"].getTime()) {
        activePeriod = "Yatsi"; nextPrayer = "Imsak"; nextPrayerDate = prayerDates["Imsak"];
      } else if (currentTimeMs >= prayerDates["Imsak"].getTime() && currentTimeMs < prayerDates["Gunes"].getTime()) {
        activePeriod = "Imsak"; nextPrayer = "Gunes"; nextPrayerDate = prayerDates["Gunes"];
      } else if (currentTimeMs >= prayerDates["Gunes"].getTime() && currentTimeMs < prayerDates["Ogle"].getTime()) {
        activePeriod = "Gunes"; nextPrayer = "Ogle"; nextPrayerDate = prayerDates["Ogle"];
      } else if (currentTimeMs >= prayerDates["Ogle"].getTime() && currentTimeMs < prayerDates["Ikindi"].getTime()) {
        activePeriod = "Ogle"; nextPrayer = "Ikindi"; nextPrayerDate = prayerDates["Ikindi"];
      } else if (currentTimeMs >= prayerDates["Ikindi"].getTime() && currentTimeMs < prayerDates["Aksam"].getTime()) {
        activePeriod = "Ikindi"; nextPrayer = "Aksam"; nextPrayerDate = prayerDates["Aksam"];
      } else if (currentTimeMs >= prayerDates["Aksam"].getTime() && currentTimeMs < prayerDates["Yatsi"].getTime()) {
        activePeriod = "Aksam"; nextPrayer = "Yatsi"; nextPrayerDate = prayerDates["Yatsi"];
      } else {
        activePeriod = "Yatsi"; nextPrayer = "Imsak";
        isNextPrayerTomorrow = true;
        const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
        let tomorrowImsakTime = "03:45"; 
        const localCache = getStoredTimings();
        const tFormatted = `${String(tomorrow.getDate()).padStart(2, '0')}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${tomorrow.getFullYear()}`;
        if (localCache && localCache[tFormatted]) {
          tomorrowImsakTime = localCache[tFormatted].Imsak;
        } else if (tomorrow.getFullYear() === 2026 && tomorrow.getMonth() + 1 === 6 && FALLBACK_DATA_JUNE_2026[tomorrow.getDate()]) {
          tomorrowImsakTime = FALLBACK_DATA_JUNE_2026[tomorrow.getDate()].Imsak;
        }
        nextPrayerDate = new Date(`${tomorrow.toDateString()} ${tomorrowImsakTime}:00`);
      }

      const bgTheme = THEMES[activePeriod];
      const accentTheme = THEMES[nextPrayer];
      
      document.body.style.setProperty('--theme-color-1', bgTheme.color1);
      document.body.style.setProperty('--theme-color-2', bgTheme.color2);
      document.body.style.setProperty('--theme-color-3', bgTheme.color3);
      document.body.style.setProperty('--accent-color', accentTheme.accent);

      const mosqueSvg = document.querySelector('.mosque-svg');
      if (mosqueSvg) { mosqueSvg.style.color = accentTheme.accent; }

      const diffMs = nextPrayerDate.getTime() - currentTimeMs;
      const totalSeconds = Math.max(0, Math.floor(diffMs / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('upcoming-prayer-name').textContent = PRAYER_DISPLAY_NAMES[nextPrayer];
      document.getElementById('target-prayer-time').textContent = `${String(nextPrayerDate.getHours()).padStart(2,'0')}:${String(nextPrayerDate.getMinutes()).padStart(2,'0')}`;
      
      document.getElementById('hour-value').textContent = String(hours).padStart(2, '0');
      document.getElementById('minute-value').textContent = String(minutes).padStart(2, '0');
      document.getElementById('second-value').textContent = String(seconds).padStart(2, '0');

      PRAYER_NAMES.forEach(p => {
        const row = document.getElementById(`row-${p}`);
        if (!row) return;

        const icon = document.getElementById(`icon-${p}`);
        const status = document.getElementById(`status-${p}`);
        const badge = document.getElementById(`tomorrow-badge-${p}`);
        const nameEl = document.getElementById(`name-${p}`);
        const timeEl = document.getElementById(`time-${p}`);

        row.className = 'list-item rounded-xl p-2.5 sm:p-3 flex justify-between items-center';
        status.classList.add('hidden');
        badge.classList.add('hidden');
        
        if (p === nextPrayer) {
          row.classList.add('list-item-active');
          icon.innerHTML = '►';
          icon.style.color = accentTheme.accent;
          icon.style.opacity = '1';
          nameEl.style.color = '#020617';
          timeEl.style.color = '#020617';
          if (isNextPrayerTomorrow && p === 'Imsak') {
            badge.classList.remove('hidden');
            badge.style.color = accentTheme.accent;
            badge.style.borderColor = accentTheme.accent;
            badge.style.backgroundColor = 'transparent';
          }
        } else {
          let isPassed = false;
          if (activePeriod === "Yatsi" && nextPrayer === "Imsak") {
             if (isNextPrayerTomorrow) {
                 isPassed = true;
             } else {
                 isPassed = false;
             }
          } else {
             const activeIdx = PRAYER_NAMES.indexOf(nextPrayer);
             const thisIdx = PRAYER_NAMES.indexOf(p);
             if (thisIdx < activeIdx) isPassed = true;
          }

          if (isPassed) {
            row.classList.add('list-item-passed');
            icon.innerHTML = '✓';
            icon.style.color = '';
            icon.style.opacity = '0.4';
            status.classList.remove('hidden');
            nameEl.style.color = '';
            timeEl.style.color = '';
          } else {
            row.classList.add('list-item-future');
            icon.innerHTML = '';
            icon.style.color = '';
            icon.style.opacity = '0.3';
            nameEl.style.color = '';
            timeEl.style.color = '';
          }
        }
      });
    }

    async function init() {
      await loadPrayerData();
      updateEngine();
      setInterval(updateEngine, 1000);
      let activeDateDay = new Date().getDate();
      setInterval(async () => {
        const currentDay = new Date().getDate();
        if (currentDay !== activeDateDay) {
          activeDateDay = currentDay;
          await loadPrayerData();
        }
      }, 10000);
    }

    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }

    let wakeLockObj = null;
    async function acquireWakeLock() { try { if ('wakeLock' in navigator) { wakeLockObj = await navigator.wakeLock.request('screen'); } } catch (err) {} }
    document.addEventListener('visibilitychange', async () => { if (wakeLockObj !== null && document.visibilityState === 'visible') { await acquireWakeLock(); } });
    window.addEventListener('DOMContentLoaded', () => { init(); document.body.addEventListener('click', acquireWakeLock, { once: true }); document.body.addEventListener('touchstart', acquireWakeLock, { once: true }); });
  </script>
</body>
</html>
