<!DOCTYPE html>
<html lang="tr" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ezan İzmir - Premium</title>
  
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ezan İzmir">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Theme Variables */
    :root {
      --bg-top: #f8fafc;
      --bg-mid: #f1f5f9;
      --bg-bot: #e2e8f0;
      --accent: #ea580c; /* Orange/Sun */
      --text-main: #0f172a;
      --text-muted: #64748b;
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-active: rgba(255, 255, 255, 0.85);
      --arc-stroke: rgba(15, 23, 42, 0.2);
      --watermark: rgba(15, 23, 42, 0.04);
      --node-fill: #ffffff;
      --node-stroke: rgba(0,0,0,0.1);
    }
    
    [data-theme="dark"] {
      --bg-top: #0f172a;
      --bg-mid: #1e293b;
      --bg-bot: #020617;
      --accent: #38bdf8; /* Blue/Moon */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-bg: rgba(15, 23, 42, 0.45);
      --glass-border: rgba(255, 255, 255, 0.05);
      --glass-active: rgba(30, 41, 59, 0.85);
      --arc-stroke: rgba(255, 255, 255, 0.2);
      --watermark: rgba(255, 255, 255, 0.02);
      --node-fill: #1e293b;
      --node-stroke: rgba(255,255,255,0.2);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-mid) 40%, var(--bg-bot) 100%);
      background-attachment: fixed;
      transition: background 0.5s ease, color 0.5s ease;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      user-select: none;
    }
    .outfit-font { font-family: 'Outfit', sans-serif; }

    /* Izmir Clock Tower Silhouette Watermark */
    .izmir-bg {
      position: absolute;
      bottom: 0;
      right: -10%;
      height: 60vh;
      opacity: 1; /* Opacity handled by variable */
      color: var(--watermark);
      pointer-events: none;
      filter: blur(1px);
      transition: color 0.5s ease;
    }

    /* Glassmorphism Classes */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
      transition: background 0.5s ease, border-color 0.5s ease;
    }
    .glass-active {
      background: var(--glass-active);
      border: 1px solid var(--accent);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      transform: scale(1.02);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* SVG ARC SYSTEM */
    .svg-arc-wrapper {
      position: relative;
      width: 100%;
      height: auto;
      margin-top: 1vh;
      display: flex;
      justify-content: center;
    }
    .arc-svg {
      width: 100%;
      max-width: 380px; /* Constraints for massive screens */
      overflow: visible;
    }
    
    .node-circle {
      fill: var(--node-fill);
      stroke: var(--node-stroke);
      stroke-width: 1.5;
      transition: fill 0.5s ease, stroke 0.5s ease;
    }
    .node-circle.active {
      fill: var(--accent);
      stroke: var(--text-main);
      stroke-width: 1;
      r: 4.5;
      filter: drop-shadow(0 0 4px var(--accent));
    }
    
    #sun-wrapper {
      transition: transform 0.1s linear; /* Smooth real-time tracking */
    }

    /* Countdown text inside SVG container area */
    .countdown-center {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    /* Typography Clamps */
    .text-massive { font-size: clamp(2.5rem, 8vw, 3.5rem); line-height: 1; }
    .text-huge { font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.1; }
    .text-big { font-size: clamp(1.2rem, 4vw, 1.5rem); }
    .text-med { font-size: clamp(1rem, 3.5vw, 1.1rem); }
    .text-small { font-size: clamp(0.7rem, 2.5vw, 0.85rem); }

    .safe-area-pt { padding-top: max(1rem, env(safe-area-inset-top)); }
    .safe-area-pb { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }

    /* Theme Toggle Switch */
    .theme-toggle {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="safe-area-pt safe-area-pb">

  <!-- Watermark -->
  <svg class="izmir-bg" viewBox="0 0 200 600" preserveAspectRatio="xMaxYMax meet" xmlns="http://www.w3.org/2000/svg">
    <path d="M80,600 L80,200 L70,200 L70,180 L80,180 L80,150 L100,100 L120,150 L120,180 L130,180 L130,200 L120,200 L120,600 Z" fill="currentColor"/>
    <circle cx="100" cy="165" r="8" fill="transparent" stroke="currentColor" stroke-width="2"/>
    <rect x="90" y="220" width="20" height="300" fill="currentColor" opacity="0.5"/>
  </svg>

  <div class="relative z-10 flex flex-col h-full w-full max-w-md mx-auto px-4 lg:max-w-lg mt-4">
    
    <!-- HEADER -->
    <header class="flex justify-between items-start shrink-0 mb-4">
      <div class="flex flex-col">
        <h1 class="text-big font-black tracking-widest outfit-font uppercase" style="color: var(--text-main)">İzmir</h1>
        <span id="gregorian-date" class="text-med font-bold" style="color: var(--text-muted)">-- ---- ----</span>
      </div>
      
      <!-- Theme Toggle Switch -->
      <button id="theme-switch" class="theme-toggle flex items-center justify-center p-2 rounded-full shadow-sm active:scale-95 transition-transform mt-1">
        <!-- Sun Icon (Default) -->
        <svg id="theme-icon-light" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (Hidden by default) -->
        <svg id="theme-icon-dark" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <div class="flex flex-col items-end">
        <span id="digital-clock" class="text-huge font-black outfit-font" style="color: var(--text-main)">--:--</span>
        <span id="hijri-date" class="text-small font-bold" style="color: var(--text-muted)">-- ------ ----</span>
      </div>
    </header>

    <!-- PERFECT SVG ARC SECTION -->
    <main class="w-full shrink-0 flex-1 flex flex-col justify-center min-h-[30vh]">
      <div class="svg-arc-wrapper">
        <svg class="arc-svg" viewBox="0 0 200 110" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
          <!-- The exact tracking line -->
          <!-- Radius = 90, Center = 100,100 -->
          <path d="M 10 100 A 90 90 0 0 1 190 100" fill="none" stroke="var(--arc-stroke)" stroke-dasharray="2 3" stroke-width="1.5" stroke-linecap="round"/>
          
          <!-- Nodes injected via JS -->
          <g id="svg-nodes"></g>
          
          <!-- Sun/Moon Icon wrapper moving mathematically on the path -->
          <g id="sun-wrapper" transform="translate(100, 10)">
            <svg id="arc-sun-icon" x="-10" y="-10" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5" fill="var(--accent)"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </g>
        </svg>

        <!-- Countdown perfectly centered -->
        <div class="countdown-center flex flex-col items-center">
          <h2 id="upcoming-prayer-name" class="text-huge font-black uppercase outfit-font mb-1" style="color: var(--text-main); letter-spacing: 2px;">
            --
          </h2>
          <div class="flex items-baseline gap-1">
            <span id="hour-value" class="text-massive font-black tabular-nums outfit-font" style="color: var(--text-main)">00</span>
            <span class="text-med font-bold mx-1" style="color: var(--text-muted)">:</span>
            <span id="minute-value" class="text-massive font-black tabular-nums outfit-font" style="color: var(--text-main)">00</span>
            <span class="text-med font-bold mx-1" style="color: var(--text-muted)">:</span>
            <span id="second-value" class="text-big font-black tabular-nums outfit-font" style="color: var(--text-muted)">00</span>
          </div>
          <span id="target-prayer-time" class="text-med font-bold mt-1 px-3 py-1 rounded-full border" style="background: var(--glass-bg); border-color: var(--glass-border); color: var(--text-main);">Sonraki Vakit: --:--</span>
        </div>
      </div>
    </main>

    <!-- LIST SECTION (BOTTOM) -->
    <section class="flex-1 flex flex-col justify-end pb-4 gap-2 shrink-0">
      <div id="prayer-list-container" class="grid grid-cols-1 gap-2 sm:gap-3">
        <!-- JS generates items -->
      </div>
    </section>

  </div>


  <script>
    const PRAYER_NAMES = ["Imsak", "Gunes", "Ogle", "Ikindi", "Aksam", "Yatsi"];
    const PRAYER_DISPLAY = { Imsak: "İmsak", Gunes: "Güneş", Ogle: "Öğle", Ikindi: "İkindi", Aksam: "Akşam", Yatsi: "Yatsı" };
    
    let currentTimes = null;
    let hijriStr = "-- ------ ----";
    let isDarkMode = false;
    
    function getNow() {
      return new Date();
    }

    // Math/SVG Config
    const ARC_RADIUS = 90;
    const ARC_CENTER_X = 100;
    const ARC_CENTER_Y = 100;
    
    // Angles for the SVG path. PI is left (-x), 0 is right (+x).
    const NODE_ANGLES = {
      Imsak: Math.PI,          // 180 degrees (Left)
      Gunes: Math.PI * 0.8,
      Ogle:  Math.PI * 0.6,
      Ikindi:Math.PI * 0.4,
      Aksam: Math.PI * 0.2,
      Yatsi: 0                 // 0 degrees (Right)
    };

    function parseTime(timeStr, dateObj) {
      const [h, m] = timeStr.split(':').map(Number);
      const d = new Date(dateObj);
      d.setHours(h, m, 0, 0);
      return d;
    }

    function calculateHijri(date) {
      const m = ["Muharrem","Sefer","Rebiülevvel","Rebiülahır","Cemaziyelevvel","Cemaziyelahır","Recep","Şaban","Ramazan","Şevval","Zilkade","Zilhicce"];
      return `${date.getDate()} ${m[date.getMonth()]} 1447`; 
    }

    async function loadData() {
      const realNow = new Date();
      currentTimes = { Imsak: "03:45", Gunes: "05:42", Ogle: "13:15", Ikindi: "17:10", Aksam: "20:40", Yatsi: "22:20" };
      hijriStr = calculateHijri(realNow);
      
      try {
        const stored = localStorage.getItem('ezanIzmirTimingsV2');
        if(stored) {
          const parsed = JSON.parse(stored);
          const fDay = `${String(realNow.getDate()).padStart(2,'0')}-${String(realNow.getMonth()+1).padStart(2,'0')}-${realNow.getFullYear()}`;
          if(parsed[fDay]) {
            currentTimes = parsed[fDay];
            if(currentTimes.hijri) hijriStr = currentTimes.hijri;
          }
        }
      } catch(e){}

      document.getElementById('hijri-date').textContent = hijriStr;
      document.getElementById('gregorian-date').textContent = `${realNow.getDate()} ${["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"][realNow.getMonth()]} ${realNow.getFullYear()}`;
      
      initArc();
      renderList();
    }

    // --- Perfect SVG Arc Initializer ---
    function initArc() {
      const svgNodes = document.getElementById('svg-nodes');
      svgNodes.innerHTML = '';
      PRAYER_NAMES.forEach(p => {
        const angle = NODE_ANGLES[p];
        const x = ARC_CENTER_X + (Math.cos(angle) * ARC_RADIUS); 
        const y = ARC_CENTER_Y - (Math.sin(angle) * ARC_RADIUS); // y is inverted in SVG
        
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("id", `svg-node-${p}`);
        circle.setAttribute("cx", x);
        circle.setAttribute("cy", y);
        circle.setAttribute("r", "3.5");
        circle.setAttribute("class", "node-circle");
        svgNodes.appendChild(circle);
      });
    }

    function renderList() {
      const container = document.getElementById('prayer-list-container');
      container.innerHTML = '';
      PRAYER_NAMES.forEach(p => {
        const div = document.createElement('div');
        div.id = `list-row-${p}`;
        div.className = 'glass-panel rounded-xl px-4 py-2 sm:py-3 flex justify-between items-center transition-all';
        div.innerHTML = `
          <span id="list-name-${p}" class="text-big font-black tracking-wide uppercase" style="color: var(--text-muted)">${PRAYER_DISPLAY[p]}</span>
          <span id="list-time-${p}" class="text-huge font-black tabular-nums outfit-font" style="color: var(--text-main)">${currentTimes[p]}</span>
        `;
        container.appendChild(div);
      });
    }

    // --- Engine ---
    function update() {
      if(!currentTimes) return;
      const now = getNow();
      document.getElementById('digital-clock').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      let nextPrayer = "Imsak";
      let nextDate = null;
      let prevPrayer = "Yatsi";
      let prevDate = null;
      
      const dates = {};
      PRAYER_NAMES.forEach(p => dates[p] = parseTime(currentTimes[p], now));

      for (let i=0; i<PRAYER_NAMES.length; i++) {
        const p = PRAYER_NAMES[i];
        if (now < dates[p]) {
          nextPrayer = p;
          nextDate = dates[p];
          prevPrayer = i === 0 ? "Yatsi" : PRAYER_NAMES[i-1];
          prevDate = i === 0 ? parseTime(currentTimes["Yatsi"], new Date(now.getTime() - 86400000)) : dates[prevPrayer];
          break;
        }
      }
      
      if (!nextDate) {
        nextPrayer = "Imsak";
        const tmrw = new Date(now.getTime() + 86400000);
        nextDate = parseTime(currentTimes["Imsak"], tmrw);
        prevPrayer = "Yatsi";
        prevDate = dates["Yatsi"];
      }

      // Update Countdown & Typography updates
      const diffMs = nextDate.getTime() - now.getTime();
      const totalSec = Math.max(0, Math.floor(diffMs / 1000));
      document.getElementById('upcoming-prayer-name').textContent = PRAYER_DISPLAY[nextPrayer];
      document.getElementById('target-prayer-time').textContent = `Sonraki Vakit: ${String(nextDate.getHours()).padStart(2,'0')}:${String(nextDate.getMinutes()).padStart(2,'0')}`;
      document.getElementById('hour-value').textContent = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      document.getElementById('minute-value').textContent = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      document.getElementById('second-value').textContent = String(totalSec % 60).padStart(2, '0');

      // Update List and SVG Nodes
      PRAYER_NAMES.forEach(p => {
        const node = document.getElementById(`svg-node-${p}`);
        const row = document.getElementById(`list-row-${p}`);
        const nameEl = document.getElementById(`list-name-${p}`);
        const timeEl = document.getElementById(`list-time-${p}`);

        if (p === nextPrayer) {
          node.classList.add('active');
          row.classList.remove('glass-panel');
          row.classList.add('glass-active');
          nameEl.style.color = 'var(--accent)';
          timeEl.style.color = 'var(--text-main)';
        } else {
          node.classList.remove('active');
          row.classList.add('glass-panel');
          row.classList.remove('glass-active');
          nameEl.style.color = 'var(--text-muted)';
          timeEl.style.color = 'var(--text-main)';
          
          if(now > dates[p]) {
            row.style.opacity = '0.4';
          } else {
            row.style.opacity = '1';
          }
        }
      });

      // Flawless Arc Math SVG Transformation
      const totalPeriod = nextDate.getTime() - prevDate.getTime();
      const elapsed = now.getTime() - prevDate.getTime();
      const progress = Math.max(0, Math.min(1, elapsed / totalPeriod));

      const angleStart = NODE_ANGLES[prevPrayer];
      const angleEnd = NODE_ANGLES[nextPrayer];
      
      let currentAngle;
      if (prevPrayer === "Yatsi" && nextPrayer === "Imsak") {
         currentAngle = 0 + (Math.PI * progress);
      } else {
         currentAngle = angleStart - ((angleStart - angleEnd) * progress);
      }

      const x = ARC_CENTER_X + (Math.cos(currentAngle) * ARC_RADIUS);
      const y = ARC_CENTER_Y - (Math.sin(currentAngle) * ARC_RADIUS); // y inverted for SVG

      const sunWrapper = document.getElementById('sun-wrapper');
      sunWrapper.setAttribute('transform', `translate(${x}, ${y})`);

      // Time-based Sun/Moon Icon
      const isNightTime = now < dates["Gunes"] || now >= dates["Aksam"];
      const arcSunIcon = document.getElementById('arc-sun-icon');
      if(isNightTime) {
        arcSunIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="var(--accent)"></path>`;
      } else {
        arcSunIcon.innerHTML = `
          <circle cx="12" cy="12" r="5" fill="var(--accent)"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        `;
      }
    }

    // Theme Toggle Logic
    const themeBtn = document.getElementById('theme-switch');
    const iconLight = document.getElementById('theme-icon-light');
    const iconDark = document.getElementById('theme-icon-dark');
    const arcSunIcon = document.getElementById('arc-sun-icon');

    function toggleTheme(save = true) {
      isDarkMode = !isDarkMode;
      if(isDarkMode) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f172a');
        iconLight.classList.add('hidden');
        iconDark.classList.remove('hidden');
      } else {
        document.documentElement.removeAttribute('data-theme');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8fafc');
        iconLight.classList.remove('hidden');
        iconDark.classList.add('hidden');
      }
      if(save) localStorage.setItem('ezanTheme', isDarkMode ? 'dark' : 'light');
    }

    themeBtn.addEventListener('click', () => toggleTheme(true));

    let intervalId;
    window.addEventListener('DOMContentLoaded', () => { 
      // Load saved theme
      const savedTheme = localStorage.getItem('ezanTheme');
      if(savedTheme === 'dark') {
        toggleTheme(false); // sets to dark without saving again
      }

      loadData().then(() => {
        update();
        intervalId = setInterval(update, 1000);
      });
      
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => console.log('Service Worker registered:', registration))
          .catch(error => console.log('Service Worker registration failed:', error));
      }
    });
  </script>
</body>
</html>
